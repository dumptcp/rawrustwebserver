[package]
name = "rawstatic"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "rawstatic"
path = "main.rs"

[dependencies]
arc-swap = "1"
brotli = "9"
bytes = "1.12.2"
http = "1"
httparse = "1"
httpdate = "1"
mime_guess = "2"
percent-encoding = "2"
socket2 = { version = "0.6", features = ["all"] }
tokio = { version = "1", features = ["rt", "net", "time", "io-util", "fs", "signal", "sync", "macros"] }

# libc and rlimit are Unix (open-file limit, socket options, signals). Windows
# does not build them; the calls are cfg-gated in main.rs.
[target.'cfg(unix)'.dependencies]
libc = "0.2.191"
rlimit = "0.12.0"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
